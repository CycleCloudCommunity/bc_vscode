name: Create release

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: Release number to publish (for example 1.0.2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize release number
        id: release
        env:
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          version="${RELEASE_NUMBER#v}"

          if [ -z "${version}" ]; then
            echo "release_number must not be empty" >&2
            exit 1
          fi

          tag="v${version}"

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "Version ${VERSION}" \
            --generate-notes
